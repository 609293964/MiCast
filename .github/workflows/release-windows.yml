name: release-windows

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Python deps
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install -r requirements.txt pyinstaller

      - name: Install web deps
        working-directory: web
        run: npm ci

      - name: Build app
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts\build-windows.ps1

      - name: Smoke test the exe
        run: |
          $p = Start-Process .\dist\MiCast.exe -PassThru
          $ok = $false
          for ($i = 0; $i -lt 40; $i++) {
            Start-Sleep 2
            try {
              Invoke-RestMethod http://127.0.0.1:3000/health -TimeoutSec 2 | Out-Null
              $ok = $true; break
            } catch {}
          }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          if (-not $ok) { throw "MiCast.exe did not answer /health within 80s" }

      - uses: actions/upload-artifact@v4
        with:
          name: MiCast-windows
          path: dist/MiCast.exe

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/MiCast.exe
